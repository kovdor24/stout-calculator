<!--
  Тело письма для шаблона EmailJS «Событие по смете» (mail-status).

  Это не часть сайта: файл лежит рядом с функцией, чтобы вёрстку письма можно было
  править и сравнивать вместе с кодом. Содержимое вставляется в кабинете EmailJS
  (Email Templates → нужный шаблон → Code Editor / <> ).

  Переменные, которые подставляет supabase/functions/mail-status/index.ts:
    {{status_title}}  — что произошло: «Клиент открыл смету», «Счёт выставлен», …
    {{project_name}}  — название объекта
    {{calc_id}}       — номер расчёта (или «—»)
    {{comment}}       — комментарий клиента (или «—»)
    {{view_url}}      — ссылка на смету
  В поле Subject шаблона: {{email_subject}}, в поле To Email: {{to_email}}.
-->
<div style="margin:0;padding:24px 12px;background:#F1F5F9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;margin:0 auto;background:#FFFFFF;border-radius:12px;overflow:hidden;border:1px solid #E2E8F0;">
    <tr>
      <td style="padding:20px 28px;background:#0F172A;">
        <div style="font-size:18px;font-weight:700;color:#FFFFFF;">HeatCalc.ru</div>
        <div style="font-size:13px;color:#94A3B8;margin-top:2px;">Событие по смете</div>
      </td>
    </tr>
    <tr>
      <td style="padding:28px 28px 8px 28px;">
        <div style="font-size:20px;font-weight:700;color:#0F172A;line-height:1.35;">{{status_title}}</div>
        <div style="font-size:15px;color:#475569;margin-top:6px;">Объект: <strong style="color:#0F172A;">{{project_name}}</strong></div>
        <div style="font-size:13px;color:#94A3B8;margin-top:2px;">Расчёт № {{calc_id}}</div>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 28px 0 28px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;">
          <tr>
            <td style="padding:14px 16px;font-size:14px;color:#334155;line-height:1.5;">{{comment}}</td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 28px 28px 28px;">
        <a href="{{view_url}}" style="display:inline-block;padding:12px 22px;background:#2563EB;color:#FFFFFF;font-size:15px;font-weight:600;text-decoration:none;border-radius:8px;">Открыть смету</a>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 28px;background:#F8FAFC;border-top:1px solid #E2E8F0;font-size:12px;color:#94A3B8;line-height:1.5;">
        Письмо сформировано автоматически: смета изменила состояние. Отвечать на него не нужно.
      </td>
    </tr>
  </table>
</div>
