name: Android — сборка APK

# Собирает установочный файл приложения на серверах GitHub.
# Запуск вручную: вкладка Actions → «Android — сборка APK» → Run workflow.
# Готовый APK лежит внизу страницы запуска, в разделе Artifacts.

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-android/**'
      - '.github/workflows/android-build.yml'
      # Файлы сайта едут внутрь APK — их собирает build-www.ps1. Без этих строк
      # правка в app.js или push.js уходила на GitHub, а приложение с ней никто
      # не собирал: конвейер молчал, и это выглядело как «сборка прошла раньше».
      - '*.js'
      - '*.html'
      - '*.css'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Поставить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Поставить Android SDK
        uses: android-actions/setup-android@v3

      - name: Поставить Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Собрать www из файлов сайта
        shell: pwsh
        run: ./mobile-android/build-www.ps1

      - name: Перенести www в Android-проект
        working-directory: mobile-android
        run: |
          npm ci
          npx cap sync android

      # Ключ подписи в репозитории не лежит: он хранится секретом в настройках
      # GitHub и здесь на минуту разворачивается обратно в файл.
      - name: Достать ключ подписи
        working-directory: mobile-android/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Нет секрета ANDROID_KEYSTORE_BASE64 — подписать сборку нечем."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > release.keystore

      # Магазины принимают только release: в отладочной сборке стоит флаг
      # debuggable и подпись стандартным ключом отладки, RuStore такую заворачивает.
      - name: Собрать APK
        working-directory: mobile-android/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Убрать ключ подписи
        if: always()
        working-directory: mobile-android/android
        run: rm -f release.keystore

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: heatcalc-release-apk
          path: mobile-android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
