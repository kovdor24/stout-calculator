name: Download Missing Product Images

on:
  workflow_dispatch:

jobs:
  scrape-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 pillow
      - name: Run parser script
        run: python AutoImage.py
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add img/ articles_without_images.txt
          if git diff --staged --quiet; then
            echo "Новых картинок не скачано."
          else
            git commit -m "Автоматическая загрузка отсутствующих картинок"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && exit 0
              git rebase --abort || true
              sleep 5
            done
            exit 1
          fi
