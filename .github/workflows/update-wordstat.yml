name: Wordstat Analytics

# Спрос по Яндекс.Wordstat для вкладки «Аналитика» в админке (только для
# владельца). Три режима, см. ANALYTICS_PLAN.md, раздел 3:
#   monthly  — 3-го числа, снимок по регионам + динамика по России + топ
#   pulse    — по понедельникам, короткий недельный пульс по России
#   backfill — вручную, разовый сбор истории по регионам с 2018 года
#
# timeout-minutes: 300 — backfill растягивается на час-полтора из-за часовой
# квоты Wordstat (100 запросов/час), обычный monthly/pulse укладывается
# в несколько минут.
#
# Ключ и folderId — в секретах репозитория (WORDSTAT_API_KEY,
# WORDSTAT_FOLDER_ID), выданы сервисному аккаунту wordstat-parser в
# Yandex Cloud. Локально их нет и быть не должно.
on:
  schedule:
    - cron: '0 5 3 * *'      # monthly — снимок спроса, 3-го числа
    - cron: '0 5 * * 1'      # pulse — недельный пульс, по понедельникам
    - cron: '0 5 5 * *'      # brands — рейтинги марок, 5-го числа
    - cron: '0 5 7 1,4,7,10 *'  # brands-regional — раз в квартал, 7-го
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим запуска'
        type: choice
        default: monthly
        options:
          - monthly
          - pulse
          - backfill
          - brands
          - brands-regional
          - region-all
          - dump-regions
          - top-word
      word:
        description: 'Слово для режима top-word (топ запросов, ничего не пишет)'
        type: string
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      # Зависимостей нет: скрипт ходит в Yandex Search API через urllib.
      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            case "${{ github.event.schedule }}" in
              "0 5 * * 1")        MODE="pulse" ;;
              "0 5 5 * *")        MODE="brands" ;;
              "0 5 7 1,4,7,10 *") MODE="brands-regional" ;;
              *)                  MODE="monthly" ;;
            esac
          fi
          echo "Режим: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Run Wordstat parser
        env:
          WORDSTAT_API_KEY: ${{ secrets.WORDSTAT_API_KEY }}
          WORDSTAT_FOLDER_ID: ${{ secrets.WORDSTAT_FOLDER_ID }}
          # Через переменную, а не подстановкой в саму команду: слово вводят
          # руками, и кавычка в нём иначе разорвала бы строку оболочки.
          WORD: ${{ github.event.inputs.word }}
        run: |
          case "${{ steps.mode.outputs.mode }}" in
            pulse) python AutoWordstat.py --pulse ;;
            backfill) python AutoWordstat.py --backfill ;;
            brands) python AutoWordstat.py --brands ;;
            brands-regional) python AutoWordstat.py --brands-regional ;;
            region-all) python AutoWordstat.py --region-all ;;
            dump-regions) python AutoWordstat.py --dump-regions ;;
            top-word) python AutoWordstat.py --top-word "$WORD" ;;
            *) python AutoWordstat.py ;;
          esac
      # if: always() — если backfill прервётся по таймауту или его отменят
      # руками, прогресс из analytics/.wordstat_state.json всё равно должен
      # уйти в коммит, иначе следующий запуск начнёт собирать историю заново.
      - name: Commit and push changes
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add analytics
          if git diff --staged --quiet; then
            echo "Данные Wordstat не изменились."
          else
            git commit -m "Автообновление данных Wordstat (${{ steps.mode.outputs.mode }})"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && exit 0
              git rebase --abort || true
              sleep 5
            done
            exit 1
          fi
